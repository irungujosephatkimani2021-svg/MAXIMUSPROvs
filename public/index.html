<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MAXIMUSPRO</title>
<style>
:root{--nav:#102a4c;--nav2:#173b6c;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#667085;--line:#e5e9f0;--accent:#2d6cdf}
*{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:var(--nav2);color:#fff;font-weight:600}button:hover{filter:brightness(1.08)}
.wrap{display:flex;min-height:100vh}.side{width:255px;background:var(--nav);color:#fff;padding:20px 14px;position:fixed;inset:0 auto 0 0;overflow:auto}.brand{font-size:24px;font-weight:850;padding:5px 10px 18px;letter-spacing:.3px}.schoolbadge{font-size:12px;opacity:.72;padding:0 10px 14px}.side button{display:block;width:100%;text-align:left;margin:3px 0;background:transparent;border-radius:9px}.side button:hover,.side button.active{background:#1d477d}
main{margin-left:255px;width:calc(100% - 255px);padding:24px 28px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;gap:15px}.top h1{margin:0 0 5px}.topright{display:flex;align-items:center;gap:10px}.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:#dce8f8;font-weight:800;color:var(--nav)}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px}.card,.panel{background:var(--card);border-radius:14px;padding:19px;box-shadow:0 5px 22px #0000000b;border:1px solid #edf0f4}.card .num{font-size:30px;font-weight:850;margin-top:5px}.muted{color:var(--muted)}.panel{margin-top:17px}.panel h2{margin-top:0}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}.form input,.form select,.form textarea{width:100%;padding:10px 11px;border:1px solid #ccd3dd;border-radius:9px;background:#fff}.wide{grid-column:1/-1}.scroll{overflow:auto}table{width:100%;border-collapse:collapse;min-width:650px}th,td{padding:11px 10px;border-bottom:1px solid var(--line);text-align:left}th{background:#f8fafc;font-size:13px;color:#475467}tr:hover td{background:#fbfcfe}.pill{display:inline-block;padding:4px 9px;border-radius:20px;background:#e8eef7;font-size:12px}.danger{background:#b42318}.success{color:#087443}.err{color:#b42318}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#102a4c,#1e5792)}.loginbox{width:min(420px,92vw);background:#fff;padding:34px;border-radius:18px;box-shadow:0 20px 60px #0003}.loginbox input{display:block;width:100%;padding:13px;margin:10px 0;border:1px solid #ccd3dd;border-radius:9px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}.toolbar input{padding:9px 11px;border:1px solid #ccd3dd;border-radius:9px;min-width:220px}.btn-light{background:#edf3fb;color:#173b6c}.small{font-size:12px}
@media(max-width:850px){.side{width:74px;padding:15px 8px}.brand{font-size:14px;text-align:center}.schoolbadge,.side button{font-size:0;text-align:center}.side button:first-letter{font-size:19px}main{margin-left:74px;width:calc(100% - 74px);padding:18px}.top{align-items:flex-start}.topright{font-size:12px}.cards{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const app=document.getElementById("app");
let me=null, active="dashboard";
const esc=s=>String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[m]));
async function api(url,opt={}){const r=await fetch(url,{headers:{"Content-Type":"application/json",...(opt.headers||{})},...opt});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.error||"Request failed");return j}
async function init(){try{me=await api("/api/me");renderShell();load(active)}catch(e){renderLogin()}}
function renderLogin(){app.innerHTML=`<div class="login"><div class="loginbox"><h1>MAXIMUSPRO</h1><p class="muted">Multi-School Management System</p><input id="u" placeholder="Username"><input id="p" type="password" placeholder="Password"><button style="width:100%" onclick="login()">Sign in</button><p id="err" style="color:#b42318"></p><small>Demo: superadmin / Maximus123!<br>School admin: admin1 / School123!</small></div></div>`}
async function login(){try{await api("/api/login",{method:"POST",body:JSON.stringify({username:u.value,password:p.value})});init()}catch(e){err.textContent=e.message}}
function renderShell(){app.innerHTML=`<div class="wrap"><aside class="side"><div class="brand">MAXIMUSPRO</div>
${me.user.role==="SUPER_ADMIN"?'<button onclick="load(\\'schools\\')">🏫 Schools</button>':''}
<button onclick="load('dashboard')">📊 Dashboard</button><button onclick="load('teachers')">👩‍🏫 Teachers</button><button onclick="load('classes')">📚 Classes</button><button onclick="load('students')">🎓 Learners</button><button onclick="load('exams')">📝 Exams</button><button onclick="load('marks')">✍️ Marks Entry</button><button onclick="load('analysis')">📈 Analysis</button><button onclick="load('notifications')">🔔 Notifications</button><button onclick="load('fees')">💰 Fees</button>
<button onclick="load('attendance')">🕐 Attendance</button><button onclick="load('timetable')">📅 Timetable</button>
<button onclick="load('library')">📖 Library</button><button onclick="load('resources')">🧪 Resources</button><button onclick="load('guardians')">👨‍👩‍👧 Guardians</button>
<button onclick="load('staff')">👥 Staff</button><button onclick="load('messages')">📢 Messages</button>
<button onclick="load('audit')">🔐 Audit Log</button><button onclick="load('users')">👤 User Accounts</button><button onclick="load('security')">🛡️ Security</button>
<button onclick="logout()" style="margin-top:30px">↪ Logout</button></aside><main><div class="top"><div><h1 id="title">Dashboard</h1><span class="pill">${esc(me.user.role)}</span></div><div>${esc(me.user.name)}${me.school?' — '+esc(me.school.name):''}</div></div><section id="content"></section></main></div>`}
async function load(page){active=page;document.getElementById("title").textContent=page[0].toUpperCase()+page.slice(1);const c=document.getElementById("content");try{
if(page==="dashboard"){const d=await api("/api/dashboard");c.innerHTML=`<div class="cards">${[['Schools',d.schools],['Teachers',d.teachers],['Learners',d.learners],['Classes',d.classes],['Exams',d.exams],['Marks',d.marks]].map(x=>`<div class="card"><div class="muted">${x[0]}</div><div class="num">${x[1]}</div></div>`).join("")}</div><div class="panel"><h2>Tenant security</h2><p>School-owned requests are server-scoped to the authenticated school. School users cannot choose another schoolId.</p></div>`;return}
if(page==="schools"){const rows=await api("/api/schools");c.innerHTML=`<div class="panel"><h2>Add School</h2><div class="form"><input id="sn" placeholder="School name"><input id="sm" placeholder="Motto"><input id="sp" placeholder="Phone"><input id="se" placeholder="Email"><button onclick="addSchool()">Add</button></div></div><div class="panel"><table><tr><th>Name</th><th>Phone</th><th>Status</th></tr>${rows.map(s=>`<tr><td>${esc(s.name)}</td><td>${esc(s.phone)}</td><td>${esc(s.status)}</td></tr>`).join("")}</table></div>`;return}
const map={teachers:["/api/teachers","Teacher",["name","role"]],classes:["/api/classes","Class",["name","stream"]],students:["/api/students","Learner",["admissionNo","name"]],exams:["/api/exams","Exam",["name","term","year"]],notifications:["/api/notifications","Notification",["head","body"]]};
if(map[page]){const [url,label,cols]=map[page],rows=await api(url);c.innerHTML=`<div class="panel"><h2>${label}s</h2><table><tr>${cols.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${cols.map(x=>`<td>${esc(r[x])}</td>`).join("")}</tr>`).join("")}</table></div>`;return}
if(page==="marks"){const students=await api("/api/students"),exams=await api("/api/exams");c.innerHTML=`<div class="panel"><h2>Marks Entry</h2><div class="form"><select id="student">${students.map(s=>`<option value="${s.id}">${esc(s.admissionNo)} — ${esc(s.name)}</option>`).join("")}</select><select id="exam">${exams.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select><input id="la" placeholder="Learning area"><input id="raw" type="number" placeholder="Raw score"><input id="max" type="number" placeholder="Maximum"><button onclick="saveMark()">Save mark</button></div></div>`;return}
if(page==="analysis"){const exams=await api("/api/exams");c.innerHTML=`<div class="panel"><h2>Analysis</h2><select id="ae">${exams.map(e=>`<option value="${e.id}">${esc(e.name)}</option>`).join("")}</select> <button onclick="runAnalysis()">Analyze</button><div id="out"></div></div>`;return}
}catch(e){c.innerHTML=`<div class="panel"><b>Error:</b> ${esc(e.message)}</div>`}}
async function addSchool(){await api("/api/schools",{method:"POST",body:JSON.stringify({name:sn.value,motto:sm.value,phone:sp.value,email:se.value})});load("schools")}
async function saveMark(){try{await api("/api/marks",{method:"POST",body:JSON.stringify({studentId:student.value,examId:exam.value,learningArea:la.value,rawScore:Number(raw.value),maximum:Number(max.value)})});alert("Mark saved")}catch(e){alert(e.message)}}
async function runAnalysis(){const d=await api("/api/analysis/"+ae.value);out.innerHTML=`<p><b>Mean:</b> ${d.mean}%</p><table><tr><th>Adm No</th><th>Learner</th><th>Average</th><th>Entries</th></tr>${d.learners.map(x=>`<tr><td>${esc(x.admissionNo)}</td><td>${esc(x.name)}</td><td>${x.average}%</td><td>${x.entries}</td></tr>`).join("")}</table>`}

async function financePage(c){const [rows,summary]=await Promise.all([api("/api/fees"),api("/api/finance/summary")]);c.innerHTML=`<div class="cards"><div class="card"><div class="muted">Invoiced</div><div class="num">${summary.invoiced.toLocaleString()}</div></div><div class="card"><div class="muted">Paid</div><div class="num">${summary.paid.toLocaleString()}</div></div><div class="card"><div class="muted">Outstanding</div><div class="num">${summary.outstanding.toLocaleString()}</div></div><div class="card"><div class="muted">Expenses</div><div class="num">${summary.expenses.toLocaleString()}</div></div></div><div class="panel"><div class="toolbar"><h2 style="margin:0">Finance</h2><button class="btn-light" onclick="window.location='/api/finance.csv'">Export Fees CSV</button></div><h2>Record Fee</h2><div class="form"><input id="fid" placeholder="Student ID"><input id="fa" type="number" placeholder="Amount"><input id="fd" placeholder="Description"><button onclick="addFee()">Save</button></div></div><div class="panel scroll"><table><tr><th>Student</th><th>Amount</th><th>Paid</th><th>Status</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.studentId)}</td><td>${x.amount}</td><td>${x.paid||0}</td><td>${esc(x.status||"unpaid")}</td><td><button onclick="payFee('${x.id}')">Pay</button></td></tr>`).join("")}</table></div>`}
async function addFee(){try{await api("/api/fees",{method:"POST",body:JSON.stringify({studentId:fid.value,amount:Number(fa.value),description:fd.value,status:"unpaid",paid:0})});load("fees")}catch(e){alert(e.message)}}
async function payFee(id){const amount=prompt("Payment amount");if(!amount)return;try{const j=await api("/api/fees/"+id+"/pay",{method:"POST",body:JSON.stringify({amount:Number(amount)})});alert("Receipt "+j.receipt.receiptNo+" created");load("fees")}catch(e){alert(e.message)}}
async function attendancePage(c){const rows=await api("/api/attendance");c.innerHTML=`<div class="panel"><h2>Attendance</h2><div class="form"><input id="asid" placeholder="Student ID"><input id="adate" type="date" value="${new Date().toISOString().slice(0,10)}"><select id="ast"><option>Present</option><option>Absent</option><option>Late</option><option>Excused</option></select><button onclick="addAttendance()">Save</button></div></div><div class="panel"><table><tr><th>Student</th><th>Date</th><th>Status</th></tr>${rows.map(x=>`<tr><td>${esc(x.studentId)}</td><td>${esc(x.date)}</td><td>${esc(x.status)}</td></tr>`).join("")}</table></div>`}
async function addAttendance(){try{await api("/api/attendance",{method:"POST",body:JSON.stringify({studentId:asid.value,date:adate.value,status:ast.value})});load("attendance")}catch(e){alert(e.message)}}
async function operationsPage(c,type,title){const rows=await api("/api/"+type);const fields=type==="timetables"?`<input id="oid" placeholder="Class ID"><input id="oday" placeholder="Day"><input id="ost" placeholder="Start"><input id="oet" placeholder="End"><input id="osub" placeholder="Subject">`:`<input id="oname" placeholder="Name/title"><input id="odesc" placeholder="Description">`;c.innerHTML=`<div class="panel"><h2>${title}</h2><div class="form">${fields}<button onclick="addOperation('${type}')">Add</button></div></div><div class="panel"><table><tr><th>Record</th><th>Details</th></tr>${rows.map(x=>`<tr><td>${esc(x.name||x.title||x.classId||"")}</td><td>${esc(JSON.stringify(x))}</td></tr>`).join("")}</table></div>`}
async function addOperation(type){let o={};if(type==="timetables")o={classId:oid.value,day:oday.value,startTime:ost.value,endTime:oet.value,subject:osub.value};else o={name:oname.value,description:odesc.value};try{await api("/api/"+type,{method:"POST",body:JSON.stringify(o)});load(type==="timetables"?"timetable":"library")}catch(e){alert(e.message)}}
async function resourcesPage(c){const [lab,ict,games]=await Promise.all([api("/api/laboratoryItems"),api("/api/ictAssets"),api("/api/games")]);c.innerHTML=`<div class="panel"><h2>Laboratory</h2><p>${lab.length} records</p><button onclick="resourceAdd('laboratoryItems')">Add item</button></div><div class="panel"><h2>ICT Assets</h2><p>${ict.length} records</p><button onclick="resourceAdd('ictAssets')">Add asset</button></div><div class="panel"><h2>Games</h2><p>${games.length} records</p><button onclick="resourceAdd('games')">Add activity</button></div>`}
async function resourceAdd(type){const name=prompt("Name");if(!name)return;try{await api("/api/"+type,{method:"POST",body:JSON.stringify({name})});load("resources")}catch(e){alert(e.message)}}


async function v5Generic(c,type,title,fields){const rows=await api("/api/"+type);const inputs=fields.map((f,i)=>`<input id="v5_${i}" placeholder="${f}">`).join("");c.innerHTML=`<div class="panel"><h2>${title}</h2><div class="form">${inputs}<button onclick="v5Add('${type}',${JSON.stringify(fields)})">Add</button></div></div><div class="panel scroll"><table><tr>${fields.map(f=>`<th>${f}</th>`).join("")}</tr>${rows.map(r=>`<tr>${fields.map(f=>`<td>${esc(r[f])}</td>`).join("")}</tr>`).join("")}</table></div>`}
async function v5Add(type,fields){const o={};fields.forEach((f,i)=>o[f]=$("v5_"+i).value);try{await api("/api/"+type,{method:"POST",body:JSON.stringify(o)});load(type)}catch(e){alert(e.message)}}


async function usersPage(c){const rows=await api("/api/users");c.innerHTML=`<div class="panel"><h2>User Accounts</h2><div class="form"><input id="un" placeholder="Name"><input id="uu" placeholder="Username"><input id="up" type="password" placeholder="Password (8+ chars)"><select id="ur"><option>TEACHER</option><option>DOS</option><option>HOI</option><option>DEPUTY_HOI</option><option>HOD</option><option>ACCOUNTANT</option><option>LIBRARIAN</option><option>ICT_TEACHER</option><option>LAB_TECH</option><option>GAMES_MASTER</option><option>SCHOOL_ADMIN</option></select><button onclick="addUser()">Create</button></div></div><div class="panel scroll"><table><tr><th>Name</th><th>Username</th><th>Role</th><th>Status</th><th>Action</th></tr>${rows.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.username)}</td><td>${esc(x.role)}</td><td>${esc(x.status)}</td><td><button onclick="toggleUser('${x.id}','${x.status==="ACTIVE"?"DISABLED":"ACTIVE"}')">${x.status==="ACTIVE"?"Disable":"Activate"}</button> <button onclick="resetUser('${x.id}')">Reset Password</button></td></tr>`).join("")}</table></div>`}
async function addUser(){try{await api("/api/users",{method:"POST",body:JSON.stringify({name:un.value,username:uu.value,password:up.value,role:ur.value})});load("users")}catch(e){alert(e.message)}}
async function toggleUser(id,status){try{await api("/api/users/"+id+"/status",{method:"POST",body:JSON.stringify({status})});load("users")}catch(e){alert(e.message)}}
async function resetUser(id){const password=prompt("New password (8+ characters)");if(!password)return;try{await api("/api/users/"+id+"/password",{method:"POST",body:JSON.stringify({password})});alert("Password changed")}catch(e){alert(e.message)}}
async function securityPage(c){const [h,p]=await Promise.all([api("/api/system/health"),api("/api/permissions")]);c.innerHTML=`<div class="cards"><div class="card"><div class="muted">System</div><div class="num">${esc(h.status)}</div></div><div class="card"><div class="muted">Role</div><div class="num">${esc(p.role)}</div></div></div><div class="panel"><h2>My permissions</h2><p>${p.permissions.map(x=>`<span class="pill">${esc(x)}</span>`).join(" ")}</p><h2>Tenant</h2><p>School ID: <b>${esc(h.schoolId)}</b></p><button onclick="downloadBackup()">Export School Backup</button></div>`}
async function downloadBackup(){const r=await fetch("/api/backup/export");if(!r.ok){alert("Backup export failed");return}const blob=await r.blob();const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download="MAXIMUSPRO-school-backup.json";a.click();URL.revokeObjectURL(a.href)}

function filterTable(){const q=(document.getElementById("tableSearch")?.value||"").toLowerCase();document.querySelectorAll("table tr").forEach((r,i)=>{if(i===0)return;r.style.display=r.innerText.toLowerCase().includes(q)?"":"none"})}

async function logout(){await api("/api/logout",{method:"POST"});renderLogin()}
init();
</script>
</body>
</html>
